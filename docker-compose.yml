# version is required by Docker Compose v1 (used in some Synology DSM 7.1/7.2
# builds of Container Manager). It is a no-op under Compose v2 but harmless.
version: "3.8"

# Single service supporting all translation directions.
#
# Backend options (set TRANSLATION_MODEL):
#   empty  → Helsinki-NLP OPUS-MT, one model per pair (~400 MB each, lazy loaded)
#   facebook/nllb-200-distilled-600M  → single multilingual model (~2.4 GB RAM)
#   facebook/nllb-200-distilled-1.3B  → higher quality, needs ~5 GB RAM
#
# Route by source_lang + target_lang in the request body:
#   {"text": "...", "source_lang": "sk", "target_lang": "fr"}

services:

  translator:
    image: local-translation-service:latest
    build: .
    container_name: translator
    ports:
      - "8088:8088"
    volumes:
      - ./models:/models
    environment:
      # ── Model backend ──────────────────────────────────────────────────────
      # Leave empty for OPUS-MT per-pair (default). Uncomment for NLLB:
      TRANSLATION_MODEL: "facebook/nllb-200-distilled-600M"
      FALLBACK_TRANSLATION_MODEL: ""
      # ── Chunk size ─────────────────────────────────────────────────────────
      # Use 400 or less when TRANSLATION_MODEL is set to an NLLB model.
      CHUNK_SIZE: "400"
      # ── Limits / logging ───────────────────────────────────────────────────
      MAX_CHARS_PER_REQUEST: "10000"
      LOG_TEXT: "false"
      ALLOWED_ORIGINS: "*"
      HF_HOME: "/models/huggingface"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
